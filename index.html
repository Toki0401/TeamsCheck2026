const DEADLINE = new Date("2026-06-19");
const MINS_PER_TEAM = 3;

// CSVエクスポート用ヘッダー定義（管理台帳Excelと同じ列順）
const CSV_HEADERS = [
  "No", "PrimaryOwner（回答者）", "回答者氏名", "カテゴリ", "TeamName", "ChannelName",
  "オーナー", "外部ゲスト数", "回答ステータス", "回答日時",
  "委任先氏名", "委任先部署", "委任先Mail", "次回レビュー日",
  "情シス対応ステータス", "情シス担当者", "対応完了日", "備考（情シス）",
  "ゲスト削除確認", "管理台帳更新"
];

const STATUS_COLORS = {
  A:        { bg: "#065f46", text: "#d1fae5", border: "#10b981", label: "A：継続" },
  B:        { bg: "#1e3a8a", text: "#dbeafe", border: "#3b82f6", label: "B：アーカイブ" },
  C:        { bg: "#7c2d12", text: "#fed7aa", border: "#f97316", label: "C：移管削除" },
  D:        { bg: "#7f1d1d", text: "#fecaca", border: "#ef4444", label: "D：完全削除" },
  delegate: { bg: "#4a1d96", text: "#ede9fe", border: "#8b5cf6", label: "回答者変更" },
  pending:  { bg: "#1e293b", text: "#94a3b8", border: "#334155", label: "未回答" },
};

// ===== エクスポート関数 =====
const buildCSV = (teams, answers, allData) => {
  const parseGuests = (g) => g ? g.split(",").map(x => x.trim()).filter(Boolean) : [];
  const statusLabel = { A:"A：継続", B:"B：アーカイブ", C:"C：移管削除", D:"D：完全削除", delegate:"回答者変更", pending:"未回答" };
  const teamKey = (t) => `${t.TeamName}||${t.ChannelName}`;

  const rows = teams.map((t, idx) => {
    const ans = answers[teamKey(t)] || {};
    const guestCount = parseGuests(t.Guests).length;
    const sl = statusLabel[ans.status] || "未回答";
    return [
      idx + 1,
      t.PrimaryOwner || "",
      ownerRealName || "",
      t.Category || "",
      t.TeamName || "",
      t.ChannelName || "",
      t.Owners || "",
      guestCount,
      sl,
      ans.answeredAt || "",
      ans.delegateTo?.name || "",
      ans.delegateTo?.dept || "",
      ans.delegateTo?.email || "",
      ans.reviewDate || "",
      "未対応",  // 情シス対応ステータス（初期値）
      "",        // 情シス担当者
      "",        // 対応完了日
      "",        // 備考
      guestCount > 0 ? "未確認" : "不要",
      "未",      // 管理台帳更新
    ];
  });

  const escape = (v) => {
    const s = String(v ?? "");
    return s.includes(",") || s.includes('"') || s.includes("\n")
      ? `"${s.replace(/"/g, '""')}"`
      : s;
  };

  const lines = [
    CSV_HEADERS.map(escape).join(","),
    ...rows.map(row => row.map(escape).join(","))
  ];
  return lines.join("\n");
};

const downloadCSV = (csv, filename) => {
  // UTF-8 BOM付き（Excel日本語対応）
  const bom = "\uFEFF";
  const blob = new Blob([bom + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
};

// ===== メインコンポーネント =====
function TeamsInventoryBot() {
  const [allData,       setAllData]       = useState(null);
  const [dataLoading,   setDataLoading]   = useState(true);
  const [screen,        setScreen]        = useState("login");
  const [ownerEmail,    setOwnerEmail]    = useState("");
  const [ownerRealName, setOwnerRealName] = useState("");
  const [teams,         setTeams]         = useState([]);
  const [currentIndex,  setCurrentIndex]  = useState(0);
  const [answers,       setAnswers]       = useState({});
  const [delegateInfo,  setDelegateInfo]  = useState({ dept: "", name: "", email: "" });
  const [subStep,       setSubStep]       = useState("main");
  const [reviewDate,    setReviewDate]    = useState("");
  const [showSummary,   setShowSummary]   = useState(false);
  const [loginError,    setLoginError]    = useState("");
  const [confirmDelete, setConfirmDelete] = useState(false);
  const [exportDone,    setExportDone]    = useState(false);

  // 情シス管理モード（全オーナーのデータを集約エクスポート）
  const [adminMode,     setAdminMode]     = useState(false);
  const [adminPass,     setAdminPass]     = useState("");
  const [adminError,    setAdminError]    = useState("");
  // 各オーナーの回答をまとめて保持（セッションストレージ代わりにuseState）
  const [allAnswers,    setAllAnswers]    = useState({});  // { ownerEmail: { teams, answers } }

  const today = new Date();
  const daysUntilDeadline = Math.floor((DEADLINE - today) / 86400000);
  const isUrgent = daysUntilDeadline <= 7;

  useEffect(() => {
    const decompress = async () => {
      try {
        const binary = atob(TEAMS_B64_GZ);
        const bytes = new Uint8Array(binary.length);
        for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
        const ds = new DecompressionStream("gzip");
        const writer = ds.writable.getWriter();
        const reader = ds.readable.getReader();
        writer.write(bytes); writer.close();
        const chunks = [];
        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
        }
        const total = chunks.reduce((a, c) => a + c.length, 0);
        const result = new Uint8Array(total);
        let offset = 0;
        for (const c of chunks) { result.set(c, offset); offset += c.length; }
        setAllData(JSON.parse(new TextDecoder("utf-8").decode(result)));
      } catch(e) { console.error(e); setAllData({}); }
      finally { setDataLoading(false); }
    };
    decompress();
  }, []);

  const currentTeam   = teams[currentIndex];
  const completedCount = Object.keys(answers).length;
  const remainingCount = teams.length - completedCount;
  const estimatedMins  = remainingCount * MINS_PER_TEAM;
  const teamKey  = (t) => t ? `${t.TeamName}||${t.ChannelName}` : "";
  const parseGuests = (g) => g ? g.split(",").map(x=>x.trim()).filter(Boolean) : [];
  const guests   = currentTeam ? parseGuests(currentTeam.Guests) : [];
  const ownerName = ownerRealName || ownerEmail.split("@")[0].replace(/\./g, " ");

  const handleLogin = () => {
    setLoginError("");
    if (!ownerRealName.trim()) { setLoginError("氏名を入力してください"); return; }
    if (!ownerEmail.trim()) { setLoginError("メールアドレスを入力してください"); return; }
    if (!allData) { setLoginError("データ読み込み中です"); return; }
    const myTeams = allData[ownerEmail.trim()];
    if (!myTeams || myTeams.length === 0) {
      setLoginError("このメールアドレスの担当チームが見つかりません。IS・SFチームにお問い合わせください。");
      return;
    }
    // 前回の回答を復元（同セッション内）
    const prev = allAnswers[ownerEmail.trim()];
    setTeams(myTeams);
    setAnswers(prev?.answers || {});
    setCurrentIndex(0);
    setScreen("welcome");
  };

  const saveAndNext = (status, extra = {}) => {
    const key = teamKey(currentTeam);
    const now = new Date().toLocaleString("ja-JP", { timeZone: "Asia/Tokyo" });
    const newAns = {
      ...answers,
      [key]: { status, teamName: currentTeam.TeamName, channelName: currentTeam.ChannelName,
                answeredAt: now, answeredByName: ownerRealName, ...extra }
    };
    setAnswers(newAns);
    // 全回答データにも保存
    setAllAnswers(prev => ({
      ...prev,
      [ownerEmail]: { teams, answers: newAns }
    }));
    setConfirmDelete(false); setReviewDate("");
    const nextIdx = teams.findIndex((t,i) => i > currentIndex && !newAns[teamKey(t)]);
    if (nextIdx === -1) setScreen("complete");
    else { setCurrentIndex(nextIdx); setSubStep("main"); }
  };

  // 個人エクスポート（自分の担当チームのみ）
  const handleExportOwner = () => {
    const csv = buildCSV(teams, answers, allData);
    const date = new Date().toISOString().slice(0,10).replace(/-/g,"");
    const name = ownerEmail.split("@")[0];
    downloadCSV(csv, `Teams棚卸回答_${name}_${date}.csv`);

            <div style={{ color:"#e2e8f0", fontSize:"13px", fontWeight:"700", marginBottom:"12px" }}>👤 オーナー別 回答進捗</div>
            <div style={{ maxHeight:"320px", overflowY:"auto" }}>
              {ownerProgress.map(({email,total,done},i)=>{
                const pct = total>0?Math.round((done/total)*100):0;
                return (
                  <div key={email} style={{ padding:"8px 10px", marginBottom:"4px", background:done===total&&total>0?"#0f2d0f":"#1e293b", borderRadius:"7px" }}>
                    <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"4px" }}>
                      <span style={{ color:"#e2e8f0", fontSize:"11px", fontFamily:"monospace" }}>{email}</span>
                      <span style={{ color:done===total?"#4ade80":"#94a3b8", fontSize:"11px", fontFamily:"monospace" }}>{done}/{total}件</span>
                    </div>
                    <div style={{ background:"#334155", borderRadius:"2px", height:"4px" }}>
                      <div style={{ width:`${pct}%`, height:"100%", background:pct===100?"#10b981":"#3b82f6", borderRadius:"2px", transition:"width 0.3s" }}/>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          <Btn onClick={()=>{setAdminMode(false);setScreen("login");setAdminPass("");}} v="outline">← ログアウト</Btn>
        </div>
      </div>
    );
  }

  // ======== WELCOME ========
  if (screen==="welcome") {
    const statusCounts = Object.values(answers).reduce((acc,a)=>{ acc[a.status]=(acc[a.status]||0)+1; return acc; },{});
    return wrap(<>
      <div style={{ background:"linear-gradient(135deg,#0f172a,#1e3a5f)", border:"1px solid #3b82f6", borderRadius:"14px", padding:"22px", marginBottom:"16px" }}>
        <div style={{ color:"#93c5fd", fontSize:"11px", marginBottom:"4px" }}>Teams チーム棚卸判定ツールへようこそ</div>
        <div style={{ color:"white", fontSize:"19px", fontWeight:"700", marginBottom:"14px" }}>{ownerName} さん</div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr 1fr", gap:"8px", marginBottom:"14px" }}>
          {[["📁","担当チーム数",teams.length+" 件"],["✅","回答済み",completedCount+" 件"],["⏱️","予測残り時間",estimatedMins+" 分"]].map(([ic,l,v],i)=>(
            <div key={i} style={{ background:"#1e293b", borderRadius:"9px", padding:"10px", textAlign:"center" }}>
              <div style={{ fontSize:"16px", marginBottom:"2px" }}>{ic}</div>
              <div style={{ color:"#60a5fa", fontSize:"17px", fontWeight:"700" }}>{v}</div>
              <div style={{ color:"#64748b", fontSize:"9px" }}>{l}</div>
            </div>
          ))}
        </div>
        {completedCount>0&&(
          <div style={{ background:"#0f2d0f", border:"1px solid #166534", borderRadius:"7px", padding:"9px 12px", marginBottom:"12px" }}>
            <div style={{ color:"#4ade80", fontSize:"11px", marginBottom:"5px" }}>✅ 前回の回答が保存されています。</div>
            <div style={s.row}>{Object.entries(statusCounts).map(([k,v])=><span key={k} style={{ display:"inline-flex", alignItems:"center", gap:"4px" }}><StatusBadge status={k}/><span style={{ color:"#64748b", fontSize:"10px" }}>{v}件</span></span>)}</div>
          </div>
        )}
        <div style={{ color:"#94a3b8", fontSize:"11px", lineHeight:"1.8" }}>
          時間が確保できるようでしたら「回答する」を選択してください。
        </div>
      </div>

      <div style={{ ...s.row, marginBottom:"16px" }}>
        <Btn onClick={()=>{setSubStep("main");setScreen("question1");}} v="primary">
          → {completedCount>0?"続きから回答する":"回答する"}
        </Btn>
        <Btn onClick={()=>setShowSummary(true)} v="outline">📊 回答状況を確認</Btn>
        <Btn onClick={()=>{setOwnerEmail("");setOwnerRealName("");setAnswers({});setScreen("login");}} v="outline" sm>ログアウト</Btn>
      </div>

      {completedCount>0&&<ExportBox compact/>}

      <ManualDownloadBtn/>
      <div style={{ padding:"12px 14px", background:"#0f172a", border:"1px solid #1e293b", borderRadius:"9px" }}>
        <div style={{ color:"#f87171", fontSize:"10px", fontWeight:"600", marginBottom:"3px" }}>⏰ リマインドについて</div>
        <div style={{ color:"#94a3b8", fontSize:"10px", lineHeight:"1.7" }}>
          {daysUntilDeadline>7?`回答期限は2026年6月19日（金）（残り${daysUntilDeadline}日）です。3営業日後にリマインドをお送りします。`:`⚠️ 回答期限（6月19日）まで残り${daysUntilDeadline}日！毎日リマインドをお送りします。`}
        </div>
      </div>

      {showSummary&&(
        <div style={{ position:"fixed", inset:0, background:"rgba(0,0,0,0.85)", display:"flex", alignItems:"center", justifyContent:"center", zIndex:200, padding:"16px" }}>
          <div style={{ background:"#0f172a", border:"1px solid #334155", borderRadius:"14px", padding:"22px", maxWidth:"460px", width:"100%", maxHeight:"80vh", overflowY:"auto" }}>
            <div style={{ color:"white", fontSize:"15px", fontWeight:"700", marginBottom:"14px" }}>📊 回答状況一覧</div>
            {teams.map((t,i)=>{
              const ans=answers[teamKey(t)];
              return (
                <div key={i} style={{ padding:"8px 11px", marginBottom:"4px", background:ans?"#0f2d0f":"#1e293b", borderRadius:"7px", display:"flex", justifyContent:"space-between", alignItems:"center", gap:"8px" }}>
                  <div style={{ flex:1, minWidth:0 }}>
                    <div style={{ color:"#e2e8f0", fontSize:"11px", overflow:"hidden", textOverflow:"ellipsis", whiteSpace:"nowrap" }}>{t.TeamName}</div>
                    <div style={{ color:"#64748b", fontSize:"9px" }}>ch: {t.ChannelName}</div>
                  </div>
                  <StatusBadge status={ans?.status||"pending"}/>
                </div>
              );
            })}
            <div style={{ marginTop:"12px" }}><Btn onClick={()=>setShowSummary(false)} v="outline" full>閉じる</Btn></div>
          </div>
        </div>
      )}
    </>);
  }

  // ======== QUESTION 1 ========
  if (screen==="question1") return wrap(<>
    <TeamCardFull/>
    {subStep==="main"&&(
      <div style={s.qcard}>
        <StepLabel n="Q1" label="内容確認"/>
        <div style={{ color:"#e2e8f0", fontSize:"14px", fontWeight:"600", marginBottom:"4px" }}>このTeamsチームの内容を理解していますか？</div>
        <div style={{ color:"#64748b", fontSize:"11px", marginBottom:"16px" }}>このまま棚卸の質問に進んでも大丈夫ですか？</div>
        <div style={s.row}>
          <Btn onClick={()=>setSubStep("understand_ok")} v="success">✅ はい、理解しています</Btn>
          <Btn onClick={()=>setSubStep("delegate_check")} v="outline">⚠️ よくわからない</Btn>
        </div>
      </div>
    )}
    {subStep==="delegate_check"&&(
      <div style={s.qcard}>
        <StepLabel n="Q2" label="回答者確認"/>
        <div style={{ color:"#e2e8f0", fontSize:"14px", fontWeight:"600", marginBottom:"16px" }}>より詳しく回答できる社員がいますか？</div>
        <div style={{ ...s.row, marginBottom:"10px" }}>
          <Btn onClick={()=>setSubStep("delegate_form")} v="primary">✅ はい、います</Btn>
          <Btn onClick={()=>setSubStep("understand_ok")} v="outline">いない / 自分が回答します</Btn>
        </div>
        <Btn onClick={()=>setSubStep("main")} v="outline" sm>← 戻る</Btn>
      </div>
    )}
    {subStep==="delegate_form"&&(
      <div style={{ ...s.qcard, border:"2px solid #7c3aed" }}>
        <div style={{ color:"#a78bfa", fontSize:"12px", fontWeight:"600", marginBottom:"12px" }}>📋 回答者の情報を入力してください</div>
        {[["dept","部署名","text"],["name","氏名 *","text"],["email","メールアドレス *","email"]].map(([f,l,t])=>(
          <div key={f} style={{ marginBottom:"10px" }}>
            <label style={{ ...s.label, marginBottom:"4px" }}>{l}</label>
            <input type={t} value={delegateInfo[f]} onChange={e=>setDelegateInfo(p=>({...p,[f]:e.target.value}))} style={s.input}/>
          </div>
        ))}
        <div style={s.row}>
          <Btn onClick={()=>{ if(!delegateInfo.name||!delegateInfo.email){alert("氏名とメールアドレスは必須です");return;} saveAndNext("delegate",{delegateTo:{...delegateInfo}}); setDelegateInfo({dept:"",name:"",email:""}); }} v="purple">✅ 送信して次へ</Btn>
          <Btn onClick={()=>setSubStep("delegate_check")} v="outline">← 戻る</Btn>
        </div>
        <div style={{ color:"#94a3b8", fontSize:"10px", marginTop:"10px" }}>ご協力ありがとうございました。ご教示いただいた回答者に確認します。</div>
      </div>
    )}
    {subStep==="understand_ok"&&(
      <div style={{ ...s.qcard, border:"1px solid #065f46" }}>
        <div style={{ color:"#4ade80", fontSize:"12px", marginBottom:"12px" }}>✅ 棚卸の質問に進みます</div>
        <div style={s.row}>
          <Btn onClick={()=>{setSubStep("main");setScreen("question2");}} v="success">→ 次の質問へ進む</Btn>
          <Btn onClick={()=>setSubStep("main")} v="outline">← 戻る</Btn>
        </div>
      </div>
    )}
  </>);

  // ======== QUESTION 2 ========
  if (screen==="question2") return wrap(<>
    <TeamCardCompact/>
    {subStep==="main"&&(
      <div style={s.qcard}>
        <StepLabel n="Q1" label="使用状況"/>
        <div style={{ color:"#e2e8f0", fontSize:"15px", fontWeight:"600", marginBottom:"4px" }}>現在も使用中ですか？</div>
        <div style={{ color:"#64748b", fontSize:"11px", marginBottom:"16px" }}>日常的に投稿・ファイル共有等で利用しているかどうか</div>
        <div style={s.row}>
          <Btn onClick={()=>setSubStep("A_detail")} v="success">✅ はい（使用中）</Btn>
          <Btn onClick={()=>setSubStep("ask_archive")} v="outline">❌ いいえ（使用終了）</Btn>
        </div>
      </div>
    )}
    {subStep==="A_detail"&&(
      <div style={{ ...s.qcard, border:"2px solid #065f46" }}>
        <div style={{ display:"flex", alignItems:"center", gap:"7px", marginBottom:"14px" }}>
          <span style={{ background:"#065f46", color:"#d1fae5", padding:"2px 10px", borderRadius:"20px", fontSize:"11px", fontWeight:"700" }}>A：継続</span>
          <span style={{ color:"#4ade80", fontSize:"11px" }}>現状維持</span>
        </div>
        {guests.length>0&&(<div style={{ marginBottom:"14px" }}>
          <div style={{ color:"#f87171", fontSize:"11px", fontWeight:"600", marginBottom:"6px" }}>⚠️ ①外部ゲストを確認・削除してください（ISMS必須）</div>
          {guests.map((g,i)=><GuestBadge key={i} email={g}/>)}
          <div style={{ color:"#94a3b8", fontSize:"10px", marginTop:"5px" }}>不要なゲストはTeams上で削除してから報告してください</div>
        </div>)}
        <div style={{ marginBottom:"16px" }}>
          <div style={{ color:"#93c5fd", fontSize:"11px", fontWeight:"600", marginBottom:"7px" }}>②次回レビュー日を設定してください（目安：6ヶ月後）</div>
          <div style={{ display:"flex", gap:"7px", alignItems:"center", flexWrap:"wrap" }}>
            <input type="date" value={reviewDate} min={new Date().toISOString().split("T")[0]} onChange={e=>setReviewDate(e.target.value)}
              style={{ padding:"8px 11px", background:"#1e293b", border:"1px solid #334155", borderRadius:"7px", color:"#e2e8f0", fontSize:"12px", fontFamily:"inherit" }}/>
            <button onClick={()=>{ const d=new Date(); d.setMonth(d.getMonth()+6); setReviewDate(d.toISOString().split("T")[0]); }}
              style={{ padding:"8px 11px", background:"#1e3a5f", border:"1px solid #3b82f6", borderRadius:"7px", color:"#93c5fd", fontSize:"11px", cursor:"pointer", fontFamily:"inherit" }}>
              6ヶ月後をセット
            </button>
          </div>
        </div>
        <div style={s.row}>
          <Btn onClick={()=>{ if(!reviewDate){alert("次回レビュー日を設定してください");return;} saveAndNext("A",{reviewDate}); }} v="success">✅ 完了として報告・次へ</Btn>
          <Btn onClick={()=>setSubStep("main")} v="outline">← 戻る</Btn>
        </div>
      </div>
    )}
    {subStep==="ask_archive"&&(
      <div style={s.qcard}>
        <StepLabel n="Q2" label="記録の必要性"/>
        <div style={{ color:"#e2e8f0", fontSize:"15px", fontWeight:"600", marginBottom:"4px" }}>記録として残したいですか？</div>
        <div style={{ color:"#64748b", fontSize:"11px", marginBottom:"16px" }}>チャット履歴・ファイルを読み取り専用で参照できる状態に保存できます</div>
        <div style={{ ...s.row, marginBottom:"10px" }}>
          <Btn onClick={()=>setSubStep("B_detail")} v="primary">✅ はい（記録を残す）</Btn>
          <Btn onClick={()=>setSubStep("ask_migrate")} v="outline">❌ いいえ</Btn>
        </div>
        <Btn onClick={()=>setSubStep("main")} v="outline" sm>← 戻る</Btn>
      </div>
    )}
    {subStep==="B_detail"&&(
      <div style={{ ...s.qcard, border:"2px solid #1e3a8a" }}>
        <div style={{ display:"flex", alignItems:"center", gap:"7px", marginBottom:"14px" }}>
          <span style={{ background:"#1e3a8a", color:"#dbeafe", padding:"2px 10px", borderRadius:"20px", fontSize:"11px", fontWeight:"700" }}>B：アーカイブ</span>
          <span style={{ color:"#60a5fa", fontSize:"11px" }}>読み取り専用保存</span>
        </div>
        {guests.length>0&&(<div style={{ marginBottom:"12px" }}>
          <div style={{ color:"#f87171", fontSize:"11px", fontWeight:"600", marginBottom:"5px" }}>①外部ゲストを削除してから申請してください（必須）</div>
          {guests.map((g,i)=><GuestBadge key={i} email={g}/>)}
        </div>)}
        <InfoBox color="#60a5fa" title="📋 IS・SFチームが実施する対応">
          ① 外部ゲスト削除をTeams管理センターで確認<br/>
          ② アーカイブ実行（読み取り専用に変更）<br/>
          ③ 完了後にメールでご連絡・管理台帳を更新
        </InfoBox>
        <div style={{ color:"#94a3b8", fontSize:"10px", marginBottom:"14px" }}>⚠️ アーカイブ後はメンバー全員が読み取り専用になります。</div>
        <div style={s.row}>
          <Btn onClick={()=>saveAndNext("B")} v="primary">✅ アーカイブ希望として申請・次へ</Btn>
          <Btn onClick={()=>setSubStep("ask_archive")} v="outline">← 戻る</Btn>
        </div>
      </div>
    )}
    {subStep==="ask_migrate"&&(
      <div style={s.qcard}>
        <StepLabel n="Q3" label="データ保存の必要性"/>
        <div style={{ color:"#e2e8f0", fontSize:"15px", fontWeight:"600", marginBottom:"4px" }}>データ・チャットの保存が必要ですか？</div>
        <div style={{ color:"#64748b", fontSize:"11px", marginBottom:"16px" }}>ファイルをSharePointへ移管してからチームを削除します</div>
        <div style={{ ...s.row, marginBottom:"10px" }}>
          <Btn onClick={()=>setSubStep("C_detail")} v="warning">✅ はい（移管してから削除）</Btn>
          <Btn onClick={()=>setSubStep("D_confirm")} v="outline">❌ いいえ（完全削除）</Btn>
        </div>
        <Btn onClick={()=>setSubStep("ask_archive")} v="outline" sm>← 戻る</Btn>
      </div>
    )}
    {subStep==="C_detail"&&(
      <div style={{ ...s.qcard, border:"2px solid #7c2d12" }}>
        <div style={{ display:"flex", alignItems:"center", gap:"7px", marginBottom:"14px" }}>
          <span style={{ background:"#7c2d12", color:"#fed7aa", padding:"2px 10px", borderRadius:"20px", fontSize:"11px", fontWeight:"700" }}>C：移管削除</span>
          <span style={{ color:"#fb923c", fontSize:"11px" }}>データ移管後に削除</span>
        </div>
        <InfoBox color="#fb923c" title="📋 オーナーに実施いただく対応">
          ① 外部ゲストを即時削除<br/>
          ② 必要なチャットをPDF保存（ブラウザで Ctrl+P）<br/>
          ③ ファイルの移管先（SharePoint）をIS・SFチームに連絡
        </InfoBox>
        <InfoBox color="#60a5fa" title="📋 IS・SFチームが実施する対応">
          ① ファイルをSharePointへ移管<br/>
          ② 移管完了を確認後、チームを削除<br/>
          ③ 削除日・移管先をオーナーへ通知・管理台帳に記録
        </InfoBox>
        <div style={{ color:"#fbbf24", fontSize:"10px", marginBottom:"14px" }}>⚠️ チャット履歴はオーナー側で事前に保存してから申請してください。</div>
        <div style={s.row}>
          <Btn onClick={()=>saveAndNext("C")} v="warning">✅ 移管削除希望として申請・次へ</Btn>
          <Btn onClick={()=>setSubStep("ask_migrate")} v="outline">← 戻る</Btn>
        </div>
      </div>
    )}
    {subStep==="D_confirm"&&(
      <div style={{ ...s.qcard, border:"2px solid #7f1d1d" }}>
        <div style={{ display:"flex", alignItems:"center", gap:"7px", marginBottom:"14px" }}>
          <span style={{ background:"#7f1d1d", color:"#fecaca", padding:"2px 10px", borderRadius:"20px", fontSize:"11px", fontWeight:"700" }}>D：完全削除</span>
          <span style={{ color:"#f87171", fontSize:"11px" }}>すべてのデータを削除</span>
        </div>
        <div style={{ background:"#450a0a", border:"1px solid #dc2626", borderRadius:"8px", padding:"12px 14px", marginBottom:"14px" }}>
          <div style={{ color:"#f87171", fontSize:"11px", fontWeight:"700", marginBottom:"5px" }}>⚠️ 注意：この操作は取り消しできません</div>
          <div style={{ color:"#fca5a5", fontSize:"10px", lineHeight:"1.8" }}>
            • チーム内のすべてのファイル・チャット・メンバー情報が削除されます<br/>
            • 削除後30日間は管理センターから復元可能です<br/>
            • 30日経過後は完全消去となります
          </div>
        </div>
        <label style={{ display:"flex", alignItems:"flex-start", gap:"7px", cursor:"pointer", marginBottom:"16px" }}>
          <input type="checkbox" checked={confirmDelete} onChange={e=>setConfirmDelete(e.target.checked)} style={{ marginTop:"2px", accentColor:"#dc2626" }}/>
          <span style={{ color:"#e2e8f0", fontSize:"11px" }}>データを含めて完全に削除することに同意します</span>
        </label>
        <div style={s.row}>
          <Btn onClick={()=>{ if(!confirmDelete){alert("削除に同意するチェックを入れてください");return;} saveAndNext("D"); }} v="danger">🗑️ 完全削除希望として申請・次へ</Btn>
          <Btn onClick={()=>{setSubStep("ask_migrate");setConfirmDelete(false);}} v="outline">← 戻る</Btn>
        </div>
      </div>
    )}
  </>);

  // ======== COMPLETE ========
  if (screen==="complete") {
    const statusCounts = Object.values(answers).reduce((acc,a)=>{ acc[a.status]=(acc[a.status]||0)+1; return acc; },{});
    const totalGuests = teams.reduce((n,t)=>n+parseGuests(t.Guests).length,0);
    return wrap(<>
      <div style={{ textAlign:"center", marginBottom:"20px" }}>
        <div style={{ fontSize:"52px", marginBottom:"8px" }}>🎉</div>
        <div style={{ color:"#4ade80", fontSize:"20px", fontWeight:"700", marginBottom:"4px" }}>回答完了！ありがとうございました</div>
        <div style={{ color:"#94a3b8", fontSize:"12px" }}>{ownerName} さんの担当チーム {teams.length} 件すべての回答が送信されました</div>
      </div>

      <div style={{ display:"grid", gridTemplateColumns:"repeat(2,1fr)", gap:"8px", marginBottom:"16px" }}>
        {Object.entries(STATUS_COLORS).filter(([k])=>statusCounts[k]).map(([k,v])=>(
          <div key={k} style={{ background:"#0f172a", border:`1px solid ${v.bg}`, borderRadius:"10px", padding:"12px", textAlign:"center" }}>
            <span style={{ background:v.bg, color:v.text, padding:"2px 8px", borderRadius:"4px", fontSize:"10px", fontWeight:"700" }}>{v.label}</span>
            <div style={{ color:"white", fontSize:"22px", fontWeight:"700", marginTop:"5px" }}>{statusCounts[k]}</div>
            <div style={{ color:"#64748b", fontSize:"10px" }}>件</div>
          </div>
        ))}
      </div>

      {totalGuests>0&&(
        <div style={{ background:"#450a0a", border:"1px solid #dc2626", borderRadius:"9px", padding:"12px 14px", marginBottom:"14px" }}>
          <div style={{ color:"#f87171", fontSize:"11px", fontWeight:"600" }}>
            ⚠️ 外部ゲストが計{totalGuests}名います。A（継続）のチームについては、ゲスト棚卸・削除をTeams上で行ってください。
          </div>
        </div>
      )}

      <ExportBox/>
      <ManualDownloadBtn/>

      <div style={{ background:"#0f172a", border:"1px solid #1e293b", borderRadius:"10px", padding:"14px", marginBottom:"14px" }}>
        <div style={{ color:"#60a5fa", fontSize:"11px", fontWeight:"600", marginBottom:"7px" }}>📋 今後の流れ</div>
        <div style={{ color:"#94a3b8", fontSize:"11px", lineHeight:"2" }}>
          情報システム・SFチームが回答内容を確認し、順次対応を実施します<br/>
          アーカイブ・削除完了後にメールでご連絡します<br/>
          ご不明な点はIS・SFチームまでお問い合わせください
        </div>
      </div>

      <div style={s.row}>
        <Btn onClick={()=>setScreen("welcome")} v="outline">← トップに戻る</Btn>
      </div>
    </>);
  }

  return null;
}


const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(React.createElement(TeamsInventoryBot));
</script>
</body>
</html>
